# PingMe API — nginx site template (staging/production)
# Install: symlink into /etc/nginx/sites-available/ and enable.
# Adjust server_name, SSL cert paths, and upstream port to match your VPS.

upstream pingme_api {
    server 127.0.0.1:3003;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name pingme.hostyler.cloud;

    # Redirect HTTP to HTTPS (uncomment when TLS is configured)
    # return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pingme.hostyler.cloud;

    # ssl_certificate     /etc/letsencrypt/live/pingme.hostyler.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/pingme.hostyler.cloud/privkey.pem;

    client_max_body_size 12m;

    # Self-hosted OTA (xprem) — manifest + dashboard under /ota/
    location /ota/ {
        proxy_pass http://127.0.0.1:3010/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
    }

    # OTA asset downloads (manifest URLs use origin + /assets, not /ota/)
    location /assets {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
    }

    # eoas publish uses origin URL (no /ota prefix) — route app UUID paths to xprem
    location ~ ^/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
    }

    # REST API
    location /v1/ {
        proxy_pass http://pingme_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger — disabled in production (API only mounts /docs when NODE_ENV !== production)
    # location /docs {
    #     proxy_pass http://pingme_api;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    # }

    # Socket.io engine (WebSocket + polling). Namespace /ws is handled by the client URL.
    # On Hostyler VPS: include proxy-analytics.conf first, then ws-timeouts.conf to override 60s.
    location /socket.io/ {
        proxy_pass http://pingme_api;
        include /etc/nginx/snippets/proxy-analytics.conf;
        include /var/www/sites/pingme/infrastructure/nginx/ws-timeouts.conf;
    }

    # Legacy /ws path (some proxies); primary client uses /socket.io/ + namespace
    location /ws {
        proxy_pass http://pingme_api;
        include /etc/nginx/snippets/proxy-analytics.conf;
        include /var/www/sites/pingme/infrastructure/nginx/ws-timeouts.conf;
    }

    # Static uploads served by API
    location /v1/uploads/ {
        proxy_pass http://pingme_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
