# PingMe OTA (xprem) — nginx site template
# Install: /etc/nginx/sites-available/ota.pingme.hostyler.cloud

upstream pingme_ota {
    server 127.0.0.1:3010;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ota.pingme.hostyler.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ota.pingme.hostyler.cloud;

    # certbot fills these on first run:
    # ssl_certificate     /etc/letsencrypt/live/ota.pingme.hostyler.cloud/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/ota.pingme.hostyler.cloud/privkey.pem;

    client_max_body_size 128m;

    location / {
        proxy_pass http://pingme_ota;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
