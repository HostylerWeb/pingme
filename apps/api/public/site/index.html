<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PingMe</title>
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #f2f5f8;
      --muted: #9aa7b5;
      --accent: #3d9bfd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, #1e3a5f 0%, transparent 55%),
        var(--bg);
    }
    main {
      width: min(100%, 28rem);
      padding: 2rem 1.75rem;
      border-radius: 1rem;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    h1 {
      margin: 0 0 0.35rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .links {
      margin-top: 1.35rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
    }
    a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.92rem;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>PingMe</h1>
    <p>
      This host serves the PingMe API. Open the PingMe mobile app to sign in and use the product.
    </p>
    <div class="links">
      <a href="/downloads/pingme-staging.apk">Android app (staging APK)</a>
      <a href="/v1/legal/privacy.html">Privacy</a>
      <a href="/v1/legal/terms.html">Terms</a>
      <a href="/v1/health">API status</a>
    </div>
  </main>
</body>
</html>
