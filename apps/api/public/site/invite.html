<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Join PingMe</title>
  <meta name="description" content="Meet people nearby on PingMe — Wall posts, Break the ice, and chat when you both say yes." />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222c;
      --text: #f2f5f8;
      --muted: #9aa7b5;
      --accent: #3d9bfd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, #1e3a5f 0%, transparent 55%),
        var(--bg);
    }
    main {
      width: min(100%, 28rem);
      padding: 2rem 1.75rem;
      border-radius: 1rem;
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.98rem;
    }
    .cta {
      display: inline-block;
      margin-top: 1.35rem;
      padding: 0.75rem 1.1rem;
      border-radius: 999px;
      background: var(--accent);
      color: #061018;
      font-weight: 600;
      text-decoration: none;
      font-size: 0.95rem;
    }
    .links {
      margin-top: 1.25rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 1.1rem;
    }
    a.subtle {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.92rem;
    }
    a.subtle:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <h1>You&apos;re invited to PingMe</h1>
    <p>
      Open the PingMe app to create an account. Browse the nearby Wall, turn on Break the ice,
      and connect when you both say yes.
    </p>
    <a class="cta" id="app-link" href="pingme://invite">Open PingMe app</a>
    <div class="links">
      <a class="subtle" href="/v1/legal/privacy.html">Privacy</a>
      <a class="subtle" href="/v1/legal/terms.html">Terms</a>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var ref = params.get('ref');
      if (!ref) return;
      var link = document.getElementById('app-link');
      if (link) {
        link.href = 'pingme://invite?ref=' + encodeURIComponent(ref);
      }
    })();
  </script>
</body>
</html>
